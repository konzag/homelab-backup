# Public repo: GitHub-hosted runners only, never the homelab runner.
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  site:
    name: Site checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the site
        run: bash tests/check-site.sh
      - name: Prove every check catches its fault
        run: bash tests/selftest.sh

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks && mkdir -p "$RUNNER_TEMP/bin" && install -m 0755 gitleaks "$RUNNER_TEMP/bin/gitleaks" && rm -f gitleaks "$f"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan the whole history (a finding fails the job)
        run: gitleaks detect --source=. --redact -v
